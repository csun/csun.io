<div class="posts-list">
  <h1 class="category-heading">{{ include.heading }}</h1>
  {% assign entries = site.posts | concat: site.links | sort: 'date' | reverse %}
  {% for entry in entries %}
    {% if entry.category == include.category and entry.hide_in_category != true %}
      {% include posts_list_element.html post=entry %}
    {% endif %}
  {% endfor %}
</div>
